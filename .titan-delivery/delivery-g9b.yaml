name: Deliver titan g9b
goal: >-
  Deliver Tasks 9.2 and 9.3 only of tasks.md of OpenSpec change resilient-agent-blackboard-bun, for Claude Code and Codex. Scenarios: Answer reaches the asking agent, Falsifier does not see board questions. Find the exact scenario text with Grep on its name in openspec/changes/resilient-agent-blackboard-bun/specs, one directory per call, then find the existing code with Grep in packages and apps. Many parts already exist: add only the missing code, and one flat positive and negative test table per scenario under testing/ (cases, factories, registration in testing/unit, integration or e2e) in the style of an existing neighbour such as testing/cases/dashboard-command.ts. Set the matching rows of openspec/changes/resilient-agent-blackboard-bun/research/acceptance-map.tsv to implemented. Do the work now; do not stop to report that it is large. You have no shell and need not run anything: a later gate runs typecheck, lint and tests. Every function in a test factory must be called by a case, because the gate needs every function and line covered. State what you wrote and which scenarios still lack a test.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: g9b
    do:
      persona: builder
      task: Tasks 9.2 and 9.3 only, with their test tables and code.
    falsify:
      - persona: skeptic
        task: Check that each scenario of the named tasks has a test table in testing/ and matching code, and that acceptance map rows are set.
limits:
  max_parallel: 1
  max_minutes: 40
