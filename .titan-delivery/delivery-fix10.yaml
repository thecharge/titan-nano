name: Fix gates 10
goal: >-
  Fix exactly these gate errors, changing nothing else, keeping behavior, all existing tests and 100 percent function coverage. No comments, no inline strings (use packages/constants or packages/messages), no local type aliases or inline object types (use Zod schemas in packages/types), no string literal types (use enums in packages/constants). `bun run typecheck` output: $ tsc --noEmit | packages/types/src/index.ts(81,1): error TS2308: Module "./persona-lifecycle.ts" has already exported a member named 'PersonaEntry'. Consider explicitly re-exporting to resolve the ambiguity. | packages/types/src/index.ts(81,1): error TS2308: Module "./persona-lifecycle.ts" has already exported a member named 'PersonaEntrySchema'. Consider explicitly re-exporting to resolve the ambiguity. | packages/workflow/src/formats.ts(33,81): error TS2345: Argument of type '{ description: string; role: string; tags: string[]; tools: AgentTool[]; request_turns?: boolean | undefined; backend?: Backend | undefined; model?: string | undefined; skills?: string[] | undefined; tool_servers?: string[] | undefined; inputs?: Record<...> | undefined; outputs?: Record<...> | undefined; } | { ...; ...' is not assignable to parameter of type '[string, number, PersonaState]'. | packages/workflow/src/formats.ts(40,32): error TS2339: Property 'inputs' does not exist on type '[string, number, PersonaState]'. | packages/workflow/src/formats.ts(41,32): error TS2339: Property 'outputs' does not exist on type '[string, number, PersonaState]'. | packages/workflow/src/formats.ts(43,52): error TS2345: Argument of type 'unknown' is not assignable to parameter of type 'boolean | JSONSchema'. | testing/factories/server-process.ts(19,80): error TS2379: Argument of type '{ cwd: string | undefined; stdin: "ignore"; stdout: "ignore" | Bun.BunFile; stderr: "ignore" | Bun.BunFile; timeout: number; }' is not assignable to parameter of type 'SpawnOptions<"ignore", "ignore" | BunFile, "ignore" | BunFile>' with 'exactOptionalPropertyTypes: true'. Consider adding 'undefined' to the types of the target's properties. |  Notes: packages/types/src/index.ts exports PersonaEntry and PersonaEntrySchema twice, from workflow.ts and from persona-lifecycle.ts; keep one definition (Grep both and make persona-lifecycle.ts reuse the one in workflow.ts, or give it a different name and update its users). packages/workflow/src/formats.ts lines 33 to 43 call a function whose parameter type changed to a tuple [string, number, PersonaState]; Grep for what changed in packages/types/src/persona-lifecycle.ts and packages/knowledge and restore the original function signature used by formats.ts (a name clash between two exported functions or schemas is likely). testing/factories/server-process.ts line 19: Bun.spawn options reject `cwd: string | undefined` under exactOptionalPropertyTypes, so only add cwd when it is defined. `bun run lint` output (file:line:col message): testing/factories/persona-lifecycle.ts:73:52 Template literals are preferred over string concatenation. | apps/cli/src/commands/install.ts:54:55 String literal type. Declare an enum in packages/constants and use it instead of a literal or a union of literals. | apps/cli/src/guide.ts:11:39 Inline string literal. Use an enum or const from the constants package, a message from the messages package, or a value from the config package. | apps/cli/src/guide.ts:28:92 Inline string literal. Use an enum or const from the constants package, a message from the messages package, or a value from the config package. | apps/cli/src/launch.ts:7:12 Inline string literal. Use an enum or const from the constants package, a message from the messages package, or a value from the config package. | apps/cli/src/launch.ts:8:13 Inline string literal. Use an enum or const from the constants package, a message from the messages package, or a value from the config package. | apps/cli/src/launch.ts:9:13 Inline string literal. Use an enum or const from the constants package, a message from the messages package, or a value from the config package. | packages/knowledge/src/persona-lifecycle.ts:21:57 String literal type. Declare an enum in packages/constants and use it instead of a literal or a union of literals. | packages/knowledge/src/persona-lifecycle.ts:21:66 String literal type. Declare an enum in packages/constants and use it instead of a literal or a union of literals. | packages/knowledge/src/persona-lifecycle.ts:126:42 Inline string literal. Use an enum or const from the constants package, a message from the messages package, or a value from the config package. | packages/knowledge/src/persona-lifecycle.ts:129:40 Inline template text. Build strings from constants, messages or config values. | packages/knowledge/src/persona-pick.ts:4:8 Type alias declared outside the types package. Infer types from Zod schemas in packages/types.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fix10
    do:
      persona: builder
      task: Fix the two named type errors.
    falsify:
      - persona: skeptic
        task: Check the two named type errors are fixed by reading the lines, and that no unrelated change was made.
limits:
  max_parallel: 1
  max_minutes: 40
