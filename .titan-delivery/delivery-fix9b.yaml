name: Fix lint g9
goal: >-
  Fix exactly these lint and spelling gate errors, changing nothing else, keeping behavior and 100 percent function coverage. Lint output (bun run lint): packages/runner/src/program.ts:21:67 plugin     × String literal type. Declare an enum in packages/constants and use it instead of a literal or a union of literals. packages/runner/src/program.ts:115:22 plugin     × String literal type. Declare an enum in packages/constants and use it instead of a literal or a union of literals. packages/runner/src/program.ts:115:34 plugin     × String literal type. Declare an enum in packages/constants and use it instead of a literal or a union of literals. testing/factories/program-api.ts:32:1 plugin     × Type alias declared outside the types package. Infer types from Zod schemas in packages/types. testing/factories/program-api.ts:32:44 plugin     × String literal type. Declare an enum in packages/constants and use it instead of a literal or a union of literals.  The cause: the indexed access type ProgramOptions["backend"] counts as a string literal type, and a local type alias is not allowed in testing. Fix it by importing or inferring the needed type from a Zod schema exported by packages/types (for example export a BackendChoice type next to ProgramOptions in packages/types/src/program.ts, built from the same schema) and use it in packages/runner/src/program.ts and testing/factories/program-api.ts without any alias. Spelling output (bun run check:spelling): the word Gapless/gapless in packages/constants/src/server-startup.ts line 52 and testing/cases/server-run.ts line 25 is unknown; rename the enum member and value to a known word such as Continuous/continuous and update every use found with Grep (Grep -rn Gapless in testing and packages, one directory per call). No comments, no inline strings.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fix9b
    do:
      persona: builder
      task: Fix the two named type errors.
    falsify:
      - persona: skeptic
        task: Check the two named type errors are fixed by reading the lines, and that no unrelated change was made.
limits:
  max_parallel: 1
  max_minutes: 40
