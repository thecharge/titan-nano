name: Fix tests fixw
goal: |-
  Fix exactly these gate failures, changing nothing else.
  (1) `bun run check:promises`: `packages/knowledge/src/hub.ts:316: unbounded Promise aggregation; use lazy tasks with all or settle from @titan/core` (the call is `await Promise.all(found.results.map(async (result) => ...))` in the search method). Replace it with `all` from @titan/core given lazy tasks (read packages/core to see its signature and how other code such as packages/runner uses it), same result order and behavior.
  (2) `bun run check:unused` reports Unused exports (3): `improverRecord function packages/runner/src/improver.ts:15:17`, `improverTask function packages/runner/src/improver.ts:31:17`, `personaMeasuresCases testing/cases/persona-lifecycle.ts:229:14`. Remove the export keyword if nothing else imports them, or if the intended consumer (a factory or test that should call them) is missing, add the missing use: Grep first and say which you chose.
  (3) biome warning `testing/factories/persona-search.ts:25:11 lint/complexity/useOptionalChain: Change to an optional chain` for `if (!first || !first.persona) return PersonaSearchFixture.None;`: use `if (!first?.persona)`.
  No comments. You have no shell.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fixw
    do:
      persona: builder
      task: Fix the two named type errors.
    falsify:
      - persona: skeptic
        task: Check the two named type errors are fixwd by reading the lines, and that no unrelated change was made.
limits:
  max_parallel: 1
  max_minutes: 40
