name: Fix tests fixe
goal: >-
  Fix exactly the failing tests below without removing any test or weakening it: decide from the OpenSpec scenario text (Grep its name in openspec/changes/resilient-agent-blackboard-bun/specs, one directory per call) and the code whether the product code or the test expectation is wrong, and fix that one. Cause: several tasks were delivered in parallel and their changes now clash. Keep 100 percent function and line coverage, no comments, no inline strings, no local type aliases, no string literal types. You have no shell; read the failing factory and the code it calls. Failing output: (1) programWorkflow both cases (testing/integration/program-workflow.test.ts, factory testing/factories/program-api.ts): expected `true true` received `true false`: the second check, that the program API gives the same run record as the command line, is false. (2) workerStepList 2 cases (testing/factories/worker-step-list.ts:43): TitanError `cause: every step needs at least one falsifier` no_falsifier from validatePersonas in packages/workflow/src/formats.ts:61: give each step in the test workflow a falsify entry in the form the validator accepts. (3) unknownRequestKindRefusal cases 'a known replan kind is not refused' and 'a known ask kind is not refused' (testing/factories/board-posts.ts function unknownRequestKindRefusal): expected `0  1` received `0  0`.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fixe
    do:
      persona: builder
      task: Fix the two named type errors.
    falsify:
      - persona: skeptic
        task: Check the two named type errors are fixed by reading the lines, and that no unrelated change was made.
limits:
  max_parallel: 1
  max_minutes: 40
