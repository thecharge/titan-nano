name: Fix tests fixg
goal: >-
  Fix exactly this failing test without removing or weakening it: unknownRequestKindRefusal cases 'persona-board > Unknown request kind: a known replan kind is not refused' and '... a known ask kind is not refused' (cases in testing/cases/board-posts.ts line 73 to 80, factory function unknownRequestKindRefusal at the end of testing/factories/board-posts.ts). They expect the result string `0  1` (no refused post, one other post) but receive `0  0` (no post at all). Find the scenario text with Grep 'Unknown request kind' in openspec/changes/resilient-agent-blackboard-bun/specs (one directory per call), read how packages/board/src/posts.ts and packages/runner create posts from requests, and decide whether the board code must post a known kind request as an ordinary post (then fix the code) or the test sends the request in a form that is dropped (then fix the test). Keep 100 percent function and line coverage, no comments, no inline strings, no local type aliases, no string literal types. You have no shell.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fixg
    do:
      persona: builder
      task: Fix the two named type errors.
    falsify:
      - persona: skeptic
        task: Check the two named type errors are fixgd by reading the lines, and that no unrelated change was made.
limits:
  max_parallel: 1
  max_minutes: 40
