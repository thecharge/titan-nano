name: Fix tests fixm
goal: >-
  Fix exactly this coverage gate failure, changing nothing else. The only file below 100 percent now is packages/runner/src/program.ts: lines 98.94 percent, so exactly one executable line is never run by any test (functions are 100 percent). Candidates in that file: the `if (page.has_more) continue;` line in follow, the `await Promise.race([wake, Bun.sleep(...)])` line in follow, the throw of ProgramMessage.BackendMissing in runWorkflow, the throw of ProgramMessage.UnknownPersona in withBackends, the throw of ProgramMessage.NotStarted in engineOf, and the body of resumeRun. Read packages/runner/src/program.ts and the program tests (testing/cases/program-api.ts, testing/factories/program-api.ts, testing/integration/program-http.test.ts and program-workflow.test.ts), decide which line no case reaches, and add a positive or negative case to the table in testing/cases/program-api.ts that reaches it with a real expectation (for example run a workflow whose default backend is missing and expect the Backend error, or name an unknown persona in the backend map and expect the Arguments error, or call resumeRun / answerRequest on a run that was never started). If the line cannot be reached, simplify it away without changing behavior. No comments, no inline strings, no local type aliases, no string literal types. You have no shell.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fixm
    do:
      persona: builder
      task: Fix the two named type errors.
    falsify:
      - persona: skeptic
        task: Check the two named type errors are fixmd by reading the lines, and that no unrelated change was made.
limits:
  max_parallel: 1
  max_minutes: 40
