name: Fix tests fixb6
goal: |-
  Fix exactly this, changing nothing else. The full offline test run passes (4740 pass, 0 fail) but the coverage check reports: {"file":"apps/cli/src/commands/install.ts","rule":"uncovered_lines","lines":[27,28,29]}. Those are the catch branch of writeFileAt in apps/cli/src/commands/install.ts (the error handler that maps a file-exists error code to TitanError(ErrorCode.Exists, existingSkill(path)) and rethrows other errors). refuseExisting runs first and already throws the same TitanError for existing files, so the catch is only reached by a race, which no test makes. 100 percent line and function coverage is required. Choose the smaller correct fix: either add a test (unit(factory, cases) with positive and negative cases in the existing install tests, testing/cases/main-agent-guide.ts and testing/factories/main-agent-guide.ts) that really reaches lines 27-29 (for example writeFileAt on a path that was created after the refuseExisting check, or a path whose parent is a file so a different error is rethrown, covering both the Exists mapping and the rethrow; export what the test needs only if the package already exports test helpers that way), or remove the catch if the Exclusive flag error can simply be mapped where refuseExisting already is. Do not lower any coverage setting. No comments, no inline string literals, tests flat. You have no shell: re-read the changed files and list them.
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fixb6
    do:
      persona: builder
      task: Cover or remove lines 27-29 of install.ts.
    falsify:
      - persona: skeptic
        task: Check by reading that lines 27-29 are reached by a test that can fail, or are gone, and nothing else changed.
limits:
  max_parallel: 1
  max_minutes: 60
