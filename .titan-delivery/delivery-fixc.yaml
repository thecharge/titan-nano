name: Fix tests fixc
goal: >-
  Fix exactly the failing tests below without removing any test or weakening it: decide from the OpenSpec scenario text (Grep its name in openspec/changes/resilient-agent-blackboard-bun/specs) and the code whether the product code or the test expectation is wrong, and fix that one. Cause: several tasks were delivered in parallel and their changes now clash. Keep 100 percent function and line coverage, no comments, no inline strings, no local type aliases, no string literal types. You have no shell; read the failing factory and the code it calls. Failing output: programWorkflow (testing/integration/program-workflow.test.ts, both cases): expected `true true` received `true false` (the program API result should equal the command line result; read testing/factories/program-api.ts and packages/runner/src/program.ts). toolAsk 3 cases (testing/factories/tool-request.ts:101) and workerStepList 2 cases (testing/factories/worker-step-list.ts:44) throw TitanError `needs is only valid in graph mode` ambiguous_dependencies from packages/workflow/src/groups.ts:46: the test workflows use `needs` in sequence mode; use the workflow forms the validator accepts (read packages/workflow/src/groups.ts and an existing passing workflow test factory to copy the form).
personas:
  builder:
    description: Writes code, tests and spec updates for assigned tasks.
    model: sonnet
    role: >-
      Follow CLAUDE.md and DEV_RULES.md in the repo. Literals go in packages/constants, messages in
      packages/messages, schemas and types in packages/types. No comments. Tests use unit(factory, cases)
      with at least 2 positive and 2 negative cases. Edit only files that your task needs. Report only what
      you did, never what you assume passed. Use Glob and Grep with simple relative patterns only: no braces,
      no absolute paths, no paths outside the working folder.
    tools: [Read, Grep, Write, Edit]
    outputs:
      summary:
        type: string
  skeptic:
    description: Tries to refute the claimed delivery.
    model: sonnet
    role: >-
      Read the changed files. Refute when a named scenario has no test, a test cannot fail, a literal sits
      outside constants, or a claim is unbacked. Otherwise survive and list what you read. Use only Grep with simple relative patterns: no braces, never an absolute path. There is no Glob. Do not refute because nothing was run: a later gate runs every test; judge only by reading code and tests.
    tools: [Read, Grep]
steps:
  - id: fixc
    do:
      persona: builder
      task: Fix the two named type errors.
    falsify:
      - persona: skeptic
        task: Check the two named type errors are fixed by reading the lines, and that no unrelated change was made.
limits:
  max_parallel: 1
  max_minutes: 40
